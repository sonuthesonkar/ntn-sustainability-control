services:
  # --- Database layer ---
  db:
    # TimescaleDB: Postgres optimized for time-series data
    build:
      context: .
      dockerfile_inline: |
        FROM timescale/timescaledb:latest-pg18
        # This copies the real file from host into the image during the build
        COPY ./db/init.sql /docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./LICENSE:/LICENSE:ro # Mount license file as read-only
      - pg_data:/var/lib/postgresql # Persistent storage for DB data (note: path changed from pg18 onwards)
  
  # --- gRPC service layer ---
  grpc:
    image: ${DOCKER_USER:-local}/ntn-sustainability-control-grpc:${GRPC_VER:-0}-${IMAGE_TAG:-latest}-${GRPC_BLD_MSG:-dev}
    build:
      context: .
      dockerfile: grpc/Dockerfile
    environment:
      - LD_LIBRARY_PATH=/opt/onnxruntime/lib # Required for ONNX runtime linkage
    ports:
      - "50051:50051" # Default gRPC port

  # --- Web GUI layer ---
  web:
    image: ${DOCKER_USER:-local}/ntn-sustainability-control-web:${WEB_VER:-0}-${IMAGE_TAG:-latest}-${WEB_BLD_MSG:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Direct connection string for the Node.js application
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on: [db, grpc] # Ensures backend services are up before web starts
    ports:
      - "3000:3000" # Main web traffic
      - "9229:9229" # Node.js debugging port
    command: >
      sh -c "node
      ${DEBUG:+--inspect=0.0.0.0:9229}
      build/index.js"

# --- Network and storage config ---
networks:
  default:
    driver: bridge
    driver_opts:
      # Reduced MTU to avoid network failures due to fragmentation
      com.docker.network.driver.mtu: "1400"

volumes:
  pg_data: # Named volume for database persistence
