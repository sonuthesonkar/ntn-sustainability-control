name: Publish-Results
on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24

jobs:
  upload-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ./playwright/playwright-report # Report location 
          retention-days: 30

      - name: Final Status Notification
        run: echo "Tests finished and results uploaded."
