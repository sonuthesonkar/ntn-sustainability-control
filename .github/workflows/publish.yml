name: Publish-Results
on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24

jobs:
  upload-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: "**/playwright-report/" # Matches Playwright's default output
          retention-days: 30

      - name: Final Status Notification
        run: echo "Tests finished and results uploaded."
