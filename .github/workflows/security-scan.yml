name: Bi-monthly Security Scan
on:
  schedule:
    - cron: '0 0 1,15 * *' # Bi-monthly runs (1st and 15th)
  workflow_dispatch:   # Allows manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # To upload results to the Security tab
    steps:
      - name: Scan gRPC Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/ntn-sustainability-control-grpc:latest'
          format: 'sarif'
          output: 'trivy-grpc.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/ntn-sustainability-control-web:latest'
          format: 'sarif'
          output: 'trivy-web.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: '.'
