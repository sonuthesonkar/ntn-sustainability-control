name: Test & Publish

on:
  workflow_call:
    # Define the "Receivers" (Inputs)
    inputs:
      GRPC_DIGEST:
        required: true
        type: string
      WEB_DIGEST:
        required: true
        type: string

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24

jobs:
  test-and-upload-reports:
    runs-on: ubuntu-latest
    env:
      # Map Inputs to Environment Variables for Docker Compose
      GRPC_DIGEST: ${{ inputs.GRPC_DIGEST }}
      WEB_DIGEST: ${{ inputs.WEB_DIGEST }}
      # Secrets inherited via 'secrets: inherit'
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Pull Images, Check Digest, and Start Stack
        run: |
          echo "Pulling images from Docker Hub..."
          docker compose -f ./docker-compose-prod.yml pull
          
          echo "Verifying gRPC image digest..."
          PULLED_GRPC_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_USER}/ntn-sustainability-control-grpc:latest | cut -d'@' -f2)
          if [ "$PULLED_GRPC_DIGEST" != "$GRPC_DIGEST" ]; then
            echo "ERROR: gRPC digest mismatch! Expected $GRPC_DIGEST but got $PULLED_GRPC_DIGEST"
            exit 1
          fi

          echo "Verifying Web image digest..."
          PULLED_WEB_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_USER}/ntn-sustainability-control-web:latest | cut -d'@' -f2)
          if [ "$PULLED_WEB_DIGEST" != "$WEB_DIGEST" ]; then
            echo "ERROR: Web digest mismatch! Expected $WEB_DIGEST but got $PULLED_WEB_DIGEST"
            exit 1
          fi
          
          echo "Starting stack..."
          docker compose -f ./docker-compose-prod.yml up -d --wait

      - name: Login to Docker Hub # Required for docker scout
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Scout - Scan GRPC
        uses: docker/scout-action@v1
        with:
          command: cves
          # Use the specific SHA tag just verified
          image: ${DOCKER_USER}/ntn-sustainability-control-grpc@$GRPC_DIGEST
          sarif-file: grpc-scout.sarif
          exit-code: false # Don't block Playwright tests

      - name: Docker Scout - Scan Web
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${DOCKER_USER}/ntn-sustainability-control-web@$WEB_DIGEST
          sarif-file: web-scout.sarif
          exit-code: false

      - name: Upload Scan Results
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Upload even if previous steps failed
        with:
          sarif_file: .
      
      - name: Run Playwright Tests
        working-directory: playwright
        run: |
          # Install dependencies on the fresh runner VM
          echo "Installing dependencies in silent mode..."
          npm install -s
          
          echo "Installing browsers and their system requirements in silent mode..."
          npx playwright install --with-deps > /dev/null
          
          # Run tests using the config
          echo "Running tests with relaxed timeout (90 secs) for this pipeline"
          npx playwright test --timeout 90000
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        if: always()  # Publish reports even on failure
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ./playwright/playwright-report # Report location 
          retention-days: 30

      - name: Final Status Notification
        run: echo "Tests finished and results uploaded."
