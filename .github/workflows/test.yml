name: Test
# Test and publish test reports, annotate and push images, create attestations

run-name: >-
  ${{ github.workflow }}: 
  ${{ github.event_name }} 
  - # ${{ github.event.workflow_run.run_number || '0' }} >> ${{ github.run_number }}
  - at ${{ github.run_attempt }}
  - sha [${{ github.event.workflow_run.head_sha || github.sha }}]

on:
  workflow_run:
    workflows: ["Security"]
    types: [completed]
  workflow_dispatch:   # Allows manual trigger

permissions:
  actions: read
  contents: read
  attestations: write
  id-token: write
  packages: write
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  # Replace with actual GHCR paths (lowercase)
  IMAGE_NAME_GRPC: ntn-sustainability-control-grpc
  IMAGE_NAME_WEB: ntn-sustainability-control-web

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    # Only skip if workflow_run is the trigger AND it failed. Manual/Schedule will still run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      # From github secrets
      DB_USER: ${{ secrets.DB_USER }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    
    steps:
      - name: Check for build artifacts
        if: github.event_name == 'workflow_run'
        run: |
          # 1. Fetch the build run ID for this specific commit SHA
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.event.workflow_run.head_sha }}" --jq ".workflow_runs[0].id")
          
          # 2. Safety check: If RUN_ID is empty or null (common during scheduled runs), skip artifact lookup
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No build workflow found for this SHA (Likely scheduled trigger). Skipping tests."
            echo "IMAGES_EXIST=false" >> $GITHUB_ENV
          else
            # 3. Look for the specific artifact within the valid run ID
            HAS_ARTIFACT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "upload-images") | .name')
            
            if [[ -z "$HAS_ARTIFACT" ]]; then
              echo "No new images were built for this commit. Skipping tests."
              echo "IMAGES_EXIST=false" >> $GITHUB_ENV
            else
              echo "Artifact found. Proceeding with tests."
              echo "IMAGES_EXIST=true" >> $GITHUB_ENV
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Download images (if triggered by workflow_run, else skip)
      - name: Download Images from Build
        if: github.event_name == 'workflow_run' && env.IMAGES_EXIST == 'true'
        id: download-images
        uses: dawidd6/action-download-artifact@v21
        with:
          # Search for the successful run of 'build.yml' for the same commit
          workflow: build.yml
          commit: ${{ github.event.workflow_run.head_sha }}
          name: upload-images # Name used in the 'upload-artifact' step
          workflow_conclusion: success
          path: ./tmp

      # Load images (if available) and get metadata
      - name: Load Images
        if: github.event_name != 'workflow_run' || steps.download-images.outcome == 'success'
        id: load-images
        run: |
          if ls ./tmp/*.tar 1> /dev/null 2>&1; then
            for image in ./tmp/*.tar; do
              # Load image
              docker load --input "$image"
              
              # Get metadata
              image_name=$(basename "$image")
              
              if [[ "$image_name" == "grpc-image.tar" ]]; then
                g_ver=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest)
                
                echo "PUSH_GRPC=true" >> $GITHUB_ENV
                echo "GRPC_VER=$g_ver" >> $GITHUB_ENV
              
              elif [[ "$image_name" == "web-image.tar" ]]; then
                w_ver=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest)
                
                echo "PUSH_WEB=true" >> $GITHUB_ENV
                echo "WEB_VER=$w_ver" >> $GITHUB_ENV
              fi
            done
          else
            echo "No images found to load, skipping..."
          fi

      - name: Start Stack
        if: github.event_name != 'workflow_run' || steps.load-images.outcome == 'success'
        id: start-stack
        run: |    
          # Use docker compose to pull the images, if not already loaded (in load-images step above, e.g. in manual run)
          echo "Starting stack..."
          docker compose -f ./docker-compose-prod.yml up -d --wait

      # --- Playwright Tests ---
      - name: Run Playwright Tests
        if: steps.start-stack.outcome == 'success'
        id: run-tests
        working-directory: playwright
        run: |
          # Install dependencies on the fresh runner VM
          echo "Installing dependencies in silent mode..."
          npm install -s
          
          echo "Installing browsers and their system requirements in silent mode..."
          npx playwright install --with-deps > /dev/null
          
          # Run tests using the config
          echo "Running tests with relaxed timeout (90 secs) for this pipeline"
          npx playwright test --timeout 90000
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright Report
        if: steps.run-tests.outcome != 'skipped' # Publish reports even on failure
        id: upload-reports
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ./playwright/playwright-report # Report location 
          retention-days: 30

      # Push images to ghcr
      - name: Push images
        if: steps.run-tests.outcome == 'success' && (env.PUSH_GRPC == 'true' || env.PUSH_WEB == 'true')
        id: push-images
        run: |
          # Push gRPC image 
          if [[ "${{ env.PUSH_GRPC }}" == "true" ]]; then
            docker tag ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:${{ env.GRPC_VER }}
            docker push -a ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}
            g_digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest | cut -d'@' -f2)
            echo "GRPC_DIGEST=$g_digest" >> $GITHUB_ENV
          fi

          # Push web image 
          if [[ "${{ env.PUSH_WEB }}" == "true" ]]; then
            docker tag ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:${{ env.WEB_VER }}
            docker push -a ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}
            w_digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest | cut -d'@' -f2)
            echo "WEB_DIGEST=$w_digest" >> $GITHUB_ENV
          fi

      # --- Attestations ---
      - name: Attest gRPC Image
        if: steps.push-images.outcome == 'success' && env.PUSH_GRPC == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}
          subject-digest: ${{ env.GRPC_DIGEST }}

      - name: Attest Web Image
        if: steps.push-images.outcome == 'success' && env.PUSH_WEB == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}
          subject-digest: ${{ env.WEB_DIGEST }}
      
      # Final status summary
      - name: Final Status Notification
        if: steps.run-tests.outcome != 'skipped'
        run: |
          if [[ "${{ env.GRPC_VER }}" != "" ]]; then
            grpc_tag="${{ env.GRPC_VER }}"
          else
            grpc_tag="latest"
          fi

          if [[ "${{ env.WEB_VER }}" != "" ]]; then
            web_tag="${{ env.WEB_VER }}"
          else
            web_tag="latest"
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ---
          ### E2E Test Result - ${{ steps.run-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}
          ---
          | **Image** | **URL** |
          |:---------:|:----------:|
          | gRPC      | [${{ env.IMAGE_NAME_GRPC }}: $grpc_tag](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME_GRPC }}/?tag=$grpc_tag) |
          | Web       | [${{ env.IMAGE_NAME_WEB }}: $web_tag](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME_WEB }}/?tag=$web_tag) |
          ---
          EOF

      # Update common status
      - name: Update Unified Pipeline Status
        if: always()
        run: |
          # Use the head_sha from the trigger or the current sha
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          
          if [[ "${{ steps.run-tests.outcome }}" == "skipped" ]]; then
            desc="Skipped"
          else
            desc="${{ job.status == 'success' && 'Successful' || 'Failed' }}"
          fi

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="${{ github.workflow }} / ${{ github.job }} (${{ github.event_name }})" \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
