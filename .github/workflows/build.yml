name: CI
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  # Converts repository name to lowercase for GHCR compatibility
  IMAGE_NAME_GRPC: ntn-sustainability-control-grpc
  IMAGE_NAME_WEB: ntn-sustainability-control-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write      # Required to push to GHCR
      security-events: write # Required to upload Trivy results to GitHub Security tab

    outputs:
      # These will be empty strings if the steps are skipped
      GRPC_DIGEST: ${{ steps.build-grpc.outputs.digest }}
      WEB_DIGEST: ${{ steps.build-web.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      # Detect which folders changed
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            grpc: ['grpc/**']
            web: ['web/**']
      
      - name: Set environment vars
        id: vars
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GRPC_VER=v2.0.1" >> $GITHUB_OUTPUT
          echo "WEB_VER=v2.0.2" >> $GITHUB_OUTPUT
          echo "GRPC_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT
          echo "WEB_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- gRPC Build, Scan, and Push ---
      - name: Build and Push gRPC Image
        if: steps.changes.outputs.grpc == 'true'
        id: build-grpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./grpc/Dockerfile
          push: true
          load: false # Push directly, Trivy will pull from GHCR to scan
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:${{ steps.vars.outputs.GRPC_VER }}-${{ steps.vars.outputs.IMAGE_TAG }}-${{ steps.vars.outputs.GRPC_BLD_MSG }}
          build-args: |
            GRPC_VER=${{ steps.vars.outputs.GRPC_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            GRPC_BLD_MSG=${{ steps.vars.outputs.GRPC_BLD_MSG }}

      - name: Run Trivy Scan (gRPC)
        if: steps.changes.outputs.grpc == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest'
          format: 'sarif'
          output: 'trivy-results-grpc.sarif'
          severity: 'CRITICAL,HIGH'

      # Upload grpc results to GitHub Security tab
      - name: Upload grpc results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-grpc.sarif'
          category: 'grpc-scan-resuls'

      # --- Web Build, Scan, and Push ---
      - name: Build and Push Web Image
        if: steps.changes.outputs.web == 'true'
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          load: false # Push directly, Trivy will pull from GHCR to scan
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:${{ steps.vars.outputs.WEB_VER }}-${{ steps.vars.outputs.IMAGE_TAG }}-${{ steps.vars.outputs.WEB_BLD_MSG }}
          build-args: |
            WEB_VER=${{ steps.vars.outputs.WEB_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            WEB_BLD_MSG=${{ steps.vars.outputs.WEB_BLD_MSG }}

      - name: Run Trivy Scan (Web)
        if: steps.changes.outputs.web == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest'
          format: 'sarif'
          output: 'trivy-results-web.sarif'
          severity: 'CRITICAL,HIGH'

      # Upload web results to GitHub Security tab
      - name: Upload web results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-web.sarif'
          category: 'web-scan-resuls'

      # --- Attestations (Updated for GHCR) ---
      - name: Attest gRPC Image
        if: steps.changes.outputs.grpc == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}
          subject-digest: ${{ steps.build-grpc.outputs.digest }}

      - name: Attest Web Image
        if: steps.changes.outputs.web == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}
          subject-digest: ${{ steps.build-web.outputs.digest }}

  trigger-tests:
    needs: build
    # Trigger even if one build was skipped, but only if at least one succeeded
    if: |
      always() && 
      (needs.build.result == 'success') &&
      (needs.build.outputs.GRPC_DIGEST != '' || needs.build.outputs.WEB_DIGEST != '')
    uses: ./.github/workflows/test.yml
    with:
      GRPC_DIGEST: ${{ needs.build.outputs.GRPC_DIGEST || '' }}
      WEB_DIGEST: ${{ needs.build.outputs.WEB_DIGEST || '' }}
    secrets: inherit
