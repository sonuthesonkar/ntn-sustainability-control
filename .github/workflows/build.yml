name: Build
# Build the images

run-name: >-
  ${{ github.workflow }}: 
  ${{ github.event_name }} 
  - # ${{ github.run_number }}
  - at ${{ github.run_attempt }}
  - sha [${{ github.event.workflow_run.head_sha || github.sha }}]

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger
    inputs:
      info:
        description: '⚠️ Force a full build of both images.'
        required: false
        type: choice
        options:
          - "Full build"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  # Converts repository name to lowercase for GHCR compatibility
  IMAGE_NAME_GRPC: ntn-sustainability-control-grpc
  IMAGE_NAME_WEB: ntn-sustainability-control-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      statuses: write

    steps:
      - uses: actions/checkout@v6

      # Detect which folders changed
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            grpc: ['grpc/**']
            web: ['web/**']
      
      - name: Set environment vars
        id: vars
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GRPC_VER=v2.0.1" >> $GITHUB_OUTPUT
          echo "WEB_VER=v2.0.2" >> $GITHUB_OUTPUT
          echo "GRPC_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT
          echo "WEB_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT
          echo "BLD_NMBR=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: |
          steps.changes.outputs.grpc == 'true' || steps.changes.outputs.web == 'true' ||
          github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      # --- gRPC Build, and Save ---
      - name: Build and Save gRPC Image
        if: |
          steps.changes.outputs.grpc == 'true' || github.event_name == 'workflow_dispatch'
        id: build-grpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./grpc/Dockerfile
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest
          build-args: |
            GRPC_VER=${{ steps.vars.outputs.GRPC_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            GRPC_BLD_MSG=${{ steps.vars.outputs.GRPC_BLD_MSG }}
            BLD_NMBR=${{ steps.vars.outputs.BLD_NMBR }}
          outputs: type=docker, dest=./tmp/grpc-image.tar

      # --- Web Build, and Save ---
      - name: Build and Save Web Image
        if: |
          steps.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest
          build-args: |
            WEB_VER=${{ steps.vars.outputs.WEB_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            WEB_BLD_MSG=${{ steps.vars.outputs.WEB_BLD_MSG }}
            BLD_NMBR=${{ steps.vars.outputs.BLD_NMBR }}
          outputs: type=docker, dest=./tmp/web-image.tar

      - name: Upload Images
        if: steps.build-grpc.outcome == 'success' || steps.build-web.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: upload-images
          path: ./tmp/*-image.tar
          # Optional: Keep it for a short time to save storage
          retention-days: 1

      # --- Show summary ---
      - name: Summary Status
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ---
          ### Build Status Summary
          ---
          | **Image** | **Status** |
          |:---------:|:----------:|
          | gRPC      | ${{ steps.build-grpc.outcome == 'success' && '✅ Passed' || (steps.build-grpc.outcome == 'skipped' && '⚪ Skipped' || '❌ Failed') }} |
          | Web       | ${{ steps.build-web.outcome == 'success' && '✅ Passed' || (steps.build-web.outcome == 'skipped' && '⚪ Skipped' || '❌ Failed') }} |
          ---
          EOF

      # Update common status
      - name: Update Unified Pipeline Status
        if: always()
        run: |
          # Use the head_sha from the trigger or the current sha
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}

          if [[ ${{ steps.build-grpc.outcome }} == 'skipped' && ${{ steps.build-web.outcome }} == 'skipped' ]]; then
            desc="Skipped"
          else
            desc="${{ job.status == 'success' && 'Successful' || 'Failed' }}"
          fi

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="${{ github.workflow }} / ${{ github.job }} (${{ github.event_name }})" \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
