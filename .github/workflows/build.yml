name: Build
# Build the images

run-name: >-
  ${{ github.workflow }}: 
  ${{ github.event_name }} 
  - # ${{ github.run_number }}
  - at ${{ github.run_attempt }}
  - sha [${{ github.event.workflow_run.head_sha || github.sha }}]

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger
    inputs:
      force_build:
        description: 'Force a full build of both images'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  # Converts repository name to lowercase for GHCR compatibility
  IMAGE_NAME_GRPC: ntn-sustainability-control-grpc
  IMAGE_NAME_WEB: ntn-sustainability-control-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write      # Required to push to GHCR
      statuses: write

    steps:
      - uses: actions/checkout@v6

      # Detect which folders changed
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            grpc: ['grpc/**']
            web: ['web/**']
      
      - name: Set environment vars
        id: vars
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GRPC_VER=v2.0.1" >> $GITHUB_OUTPUT
          echo "WEB_VER=v2.0.2" >> $GITHUB_OUTPUT
          echo "GRPC_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT
          echo "WEB_BLD_MSG=Gold_Chainguard" >> $GITHUB_OUTPUT
          echo "BLD_NMBR=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: |
          steps.changes.outputs.grpc == 'true' || steps.changes.outputs.web == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_build == true)
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- gRPC Build, and Push ---
      - name: Build and Push gRPC Image
        if: |
          steps.changes.outputs.grpc == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_build == true)
        id: build-grpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./grpc/Dockerfile
          push: true
          load: false # Push directly, Trivy will pull from GHCR to scan
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Multiple gRPC services to monitor and maintain 6G sustainability KPIs.
          annotations: |
            org.opencontainers.image.description=Multiple gRPC services to monitor and maintain 6G sustainability KPIs.
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:${{ steps.vars.outputs.GRPC_VER }}-${{ steps.vars.outputs.IMAGE_TAG }}-${{ steps.vars.outputs.BLD_NMBR }}-${{ steps.vars.outputs.GRPC_BLD_MSG }}
          build-args: |
            GRPC_VER=${{ steps.vars.outputs.GRPC_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            GRPC_BLD_MSG=${{ steps.vars.outputs.GRPC_BLD_MSG }}
            BLD_NMBR=${{ steps.vars.outputs.BLD_NMBR }}

      # --- Web Build, and Push ---
      - name: Build and Push Web Image
        if: |
          steps.changes.outputs.web == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_build == true)
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          load: false # Push directly
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=NTN Sustainability Control - Web GUI
          annotations: |
            org.opencontainers.image.description=NTN Sustainability Control - Web GUI
          tags: |
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest
            ${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:${{ steps.vars.outputs.WEB_VER }}-${{ steps.vars.outputs.IMAGE_TAG }}-${{ steps.vars.outputs.BLD_NMBR }}-${{ steps.vars.outputs.WEB_BLD_MSG }}
          build-args: |
            WEB_VER=${{ steps.vars.outputs.WEB_VER }}
            IMAGE_TAG=${{ steps.vars.outputs.IMAGE_TAG }}
            WEB_BLD_MSG=${{ steps.vars.outputs.WEB_BLD_MSG }}
            BLD_NMBR=${{ steps.vars.outputs.BLD_NMBR }}

      # --- Generate json with built digests ---
      - name: Generate Digests JSON
        id: store-digests
        if: steps.build-grpc.outcome != 'skipped' || steps.build-web.outcome != 'skipped'
        run: |
          # Get digests from build steps
          cat <<EOF > digests.json
          {
            "grpc-digest": "${{ steps.build-grpc.outputs.digest || 'NA' }}",
            "web-digest": "${{ steps.build-web.outputs.digest || 'NA' }}"
          }
          EOF

      - name: Upload Digests Artifact
        if: steps.store-digests.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: upload-image-digests
          path: digests.json
          # Optional: Keep it for a short time to save storage
          retention-days: 1

      # --- Show summary ---
      - name: Summary Status
        if: always() && (steps.build-grpc.outcome != 'skipped' || steps.build-web.outcome != 'skipped')
        run: |
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          # gRPC Section
          if [[ "${{ steps.build-grpc.outcome }}" == 'success' ]]; then
            grpc_tag="${{ steps.build-grpc.outputs.digest }}"
            echo "* **gRPC image**:" >> $GITHUB_STEP_SUMMARY 
            echo "  * Status - ✅ Successful" >> $GITHUB_STEP_SUMMARY
            echo "  * [${{ env.IMAGE_NAME_GRPC }}:$grpc_tag](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME_GRPC }}/?tag=$grpc_tag)" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.build-grpc.outcome }}" != 'skipped' ]]; then
            echo "* **gRPC image**:" >> $GITHUB_STEP_SUMMARY 
            echo "  * Status - ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Web Section
          if [[ "${{ steps.build-web.outcome }}" == 'success' ]]; then
            web_tag="${{ steps.build-web.outputs.digest }}"
            echo "* **Web image**:" >> $GITHUB_STEP_SUMMARY 
            echo "  * Status - ✅ Successful" >> $GITHUB_STEP_SUMMARY
            echo "  * [${{ env.IMAGE_NAME_WEB }}:$web_tag](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME_WEB }}/?tag=$web_tag)" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ steps.build-web.outcome }}" != 'skipped' ]]; then
            echo "* **Web image**:" >> $GITHUB_STEP_SUMMARY 
            echo "  * Status - ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY

      # Update common status
      - name: Update Unified Pipeline Status
        if: always() && (steps.build-grpc.outcome != 'skipped' || steps.build-web.outcome != 'skipped')
        run: |
          # Use the head_sha from the trigger or the current sha
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          
          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="${{ github.workflow }} / ${{ github.job }} (${{ github.event_name }})" \
            -f description="${{ job.status == 'success' && 'Successful' || 'Failed' }}" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
