name: CI
on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Map step outputs to job outputs for the next job
      IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
      GRPC_VER: ${{ steps.vars.outputs.GRPC_VER }}
      GRPC_BLD_MSG: ${{ steps.vars.outputs.GRPC_BLD_MSG }}
      WEB_VER: ${{ steps.vars.outputs.WEB_VER }}
      WEB_BLD_MSG: ${{ steps.vars.outputs.WEB_BLD_MSG }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Set environment
        id: vars
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "GRPC_VER=v1.2.0" >> $GITHUB_OUTPUT
          echo "WEB_VER=v1.1.0" >> $GITHUB_OUTPUT
          echo "GRPC_BLD_MSG=ci-build" >> $GITHUB_OUTPUT
          echo "WEB_BLD_MSG=ci-build" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Images
        env:
          # Get secrets
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          # Map environment
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          GRPC_VER: ${{ steps.vars.outputs.GRPC_VER }}
          GRPC_BLD_MSG: ${{ steps.vars.outputs.GRPC_BLD_MSG }}
          WEB_VER: ${{ steps.vars.outputs.WEB_VER }}
          WEB_BLD_MSG: ${{ steps.vars.outputs.WEB_BLD_MSG }}
        run: |
          # Build
          docker compose build
          
          # Define the specific long tags created by the build
          GRPC_FULL_TAG="${GRPC_VER}-${IMAGE_TAG}-${GRPC_BLD_MSG}"
          WEB_FULL_TAG="${WEB_VER}-${IMAGE_TAG}-${WEB_BLD_MSG}"

          # Tag latest
          docker tag ${DOCKER_USER}/ntn-sustainability-control-grpc:${GRPC_FULL_TAG} ${DOCKER_USER}/ntn-sustainability-control-grpc:latest
          docker tag ${DOCKER_USER}/ntn-sustainability-control-web:${WEB_FULL_TAG} ${DOCKER_USER}/ntn-sustainability-control-web:latest
          
          # Push all tags
          docker push ${DOCKER_USER}/ntn-sustainability-control-grpc -a
          docker push ${DOCKER_USER}/ntn-sustainability-control-web -a

  # Trigger the Test Workflow after Build completes
  trigger-tests:
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      # Pass the outputs from 'build' into 'test'
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}
      GRPC_VER: ${{ needs.build.outputs.GRPC_VER }}
      GRPC_BLD_MSG: ${{ needs.build.outputs.GRPC_BLD_MSG }}
      WEB_VER: ${{ needs.build.outputs.WEB_VER }}
      WEB_BLD_MSG: ${{ needs.build.outputs.WEB_BLD_MSG }}
    secrets: inherit
