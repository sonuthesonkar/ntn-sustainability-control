name: Security
# Build triggered, else bi-monthly security scan

run-name: >-
  ${{ github.workflow }}: 
  ${{ github.event_name }} 
  - # ${{ github.event.workflow_run.run_number || '0' }} >> ${{ github.run_number }}
  - at ${{ github.run_attempt }}
  - sha [${{ github.event.workflow_run.head_sha || github.sha }}]

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  schedule:
    - cron: '0 0 1,15 * *' # Bi-monthly runs (1st and 15th)
  workflow_dispatch:   # Allows manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt into Node.js 24
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  # Converts repository name to lowercase for GHCR compatibility
  IMAGE_NAME_GRPC: ntn-sustainability-control-grpc
  IMAGE_NAME_WEB: ntn-sustainability-control-web

jobs:
  v-scan:
    runs-on: ubuntu-latest
    # Only skip if workflow_run is the trigger AND it failed. Manual/Schedule will still run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write # To upload results to the Security tab
      id-token: write
      statuses: write
      packages: read
    
    steps:
      - name: Check if images were built
        if: github.event_name == 'workflow_run'
        run: |
          # Use GitHub CLI to check if the artifact exists in the parent run
          HAS_ARTIFACT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts --jq '.artifacts[] | select(.name=="upload-images")')
          if [[ -z "$HAS_ARTIFACT" ]]; then
            echo "Build was skipped (no changes). Skipping this workflow."
            echo "IMAGES_EXIST=false" >> $GITHUB_ENV
          else
            echo "IMAGES_EXIST=true" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Download images (if triggered by workflow_run, else skip)
      - name: Download Images
        if: github.event_name == 'workflow_run' && env.IMAGES_EXIST == 'true'
        id: download-images
        uses: actions/download-artifact@v4
        with:
          name: upload-images
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ./tmp

      # Load images (if available)
      - name: Load Images
        if: github.event_name != 'workflow_run' || steps.download-images.outcome == 'success'
        run: |
          if ls ./tmp/*.tar 1> /dev/null 2>&1; then
            for image in ./tmp/*.tar; do
              image_name=$(basename "$image")
              if [[ "$image_name" == "grpc-image.tar" ]]; then
                echo "SCAN_GRPC=true" >> $GITHUB_ENV
              elif [[ "$image_name" == "web-image.tar" ]]; then
                echo "SCAN_WEB=true" >> $GITHUB_ENV
              fi
              docker load --input "$image"
            done
          else
            echo "No images found to load, skipping..."
          fi
      
      # Scan gRPC image
      - name: Scan gRPC Image
        if: github.event_name != 'workflow_run' || env.SCAN_GRPC == 'true'
        id: scan-grpc
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest'
          format: 'sarif'
          output: 'trivy-results-grpc.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Upload grpc results to GitHub Security tab
      - name: Upload grpc results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan-grpc.outcome != 'skipped'
        with:
          sarif_file: 'trivy-results-grpc.sarif'
          category: 'grpc-scan-results'

      # Upload grpc results as artifact
      - name: Upload gRPC scan report
        if: always() && steps.scan-grpc.outcome != 'skipped'  # Publish reports even on failure
        uses: actions/upload-artifact@v6
        with:
          name: grpc-vulnerability-report
          path: trivy-results-grpc.sarif # Report location 
          retention-days: 15

      # Scan web image
      - name: Scan Web Image
        if: github.event_name != 'workflow_run' || env.SCAN_WEB == 'true'
        id: scan-web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest'
          format: 'sarif'
          output: 'trivy-results-web.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Upload web results to GitHub Security tab
      - name: Upload web results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.scan-web.outcome != 'skipped'
        with:
          sarif_file: 'trivy-results-web.sarif'
          category: 'web-scan-results'

      # Upload web results as artifact
      - name: Upload web scan report
        if: always() && steps.scan-web.outcome != 'skipped'  # Publish reports even on failure
        uses: actions/upload-artifact@v6
        with:
          name: web-vulnerability-report
          path: trivy-results-web.sarif # Report location 
          retention-days: 15

      # --- Show summary ---
      - name: Summary Status
        if: always()
        run: |
          # Helper function to find the version anywhere
          get_version() {
            local img=$1
            # 1. Try local docker first (Works for Push builds)
            local ver=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$img" 2>/dev/null || echo "")
            
            # 2. If local failed, try remote (Works for Scheduled scans)
            if [ -z "$ver" ]; then
              ver=$(skopeo inspect docker://"$img" | jq -r '.Labels["org.opencontainers.image.version"] // "n/a"' 2>/dev/null || echo "not_found")
            fi
            echo "$ver"
          }

          # Get gRPC image version, if scanned
          if [[ ${{ steps.scan-grpc.outcome }} != 'skipped' ]]; then
            g_full_ver=$(get_version "${{ env.REGISTRY }}${{ env.IMAGE_NAME_GRPC }}:latest")
          else
            g_full_ver='➖'
          fi

          # Get web image version, if scanned
          if [[ ${{ steps.scan-web.outcome }} != 'skipped' ]]; then
            w_full_ver=$(get_version "${{ env.REGISTRY }}${{ env.IMAGE_NAME_WEB }}:latest")
          else
            w_full_ver='➖'
          fi

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ---
          ### Vulnerability Scan Status Summary
          ---
          | **Image** | **Status** | **Version** |
          |:---------:|:----------:|:-----------:|
          | gRPC      | ${{ steps.scan-grpc.outcome == 'success' && '✅ Passed' || (steps.scan-grpc.outcome == 'skipped' && '⚪ Skipped' || '❌ Failed') }} | $g_full_ver |
          | Web       | ${{ steps.scan-web.outcome == 'success' && '✅ Passed' || (steps.scan-web.outcome == 'skipped' && '⚪ Skipped' || '❌ Failed') }} | $w_full_ver |
          ---
          EOF

      # Update common status
      - name: Update Unified Pipeline Status
        if: always()
        run: |
          # Use the head_sha from the trigger or the current sha
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          
          if [[ ${{ steps.scan-grpc.outcome }} == 'skipped' && ${{ steps.scan-web.outcome }} == 'skipped' ]]; then
            desc="Skipped"
          else
            desc="${{ job.status == 'success' && 'Successful' || 'Failed' }}"
          fi

          gh api repos/${{ github.repository }}/statuses/$SHA \
            -f state="${{ job.status == 'success' && 'success' || 'failure' }}" \
            -f context="${{ github.workflow }} / ${{ github.job }} (${{ github.event_name }})" \
            -f description="$desc" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
