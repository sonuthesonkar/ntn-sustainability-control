services:
  # --- TimescaleDB (PostgreSQL with Time-Series support) ---
  db:
    build:
      context: .
      dockerfile_inline: |
        FROM timescale/timescaledb:latest-pg18
        # This copies the real file from host into the image during the build
        # Required to auto-run the sql script on initial database creation
        COPY ./db/init.sql /docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Named volume to ensure data survives container restarts/deletions
      - pg_data:/var/lib/postgresql # Persistent storage for DB data (note: path changed from pg18 onwards)
    restart: always

  # --- gRPC Service ---
  grpc:
    # Pull the pre-compiled C++ gRPC logic from Docker Hub
    image: sonusonkar/ntn-sustainability-control-grpc:latest
    environment:
      # Ensure the system can find ONNX Runtime shared libraries for AI/ML inference
      - LD_LIBRARY_PATH=/opt/onnxruntime/lib
    ports:
      - "50051:50051"
    restart: always

  # --- Node.js Web Service ---
  web:
    # Pull the pre-built web application from Docker Hub
    image: sonusonkar/ntn-sustainability-control-web:latest
    environment:
      # Connection string for Node.js to reach the 'db' service
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - db   # Wait for DB container to start
      - grpc # Wait for gRPC container to start
    ports:
      - "3000:3000"
    # Executes the compiled Node.js entry point
    command: ["build/index.js"]
    restart: always

# --- Network configuration ---
networks:
  default:
    driver: bridge
    driver_opts:
      # Adjusted MTU to avoid network issues due to fragmentation
      com.docker.network.driver.mtu: "1400"

# --- Persistent storage ---
volumes:
  pg_data: # Database storage volume
